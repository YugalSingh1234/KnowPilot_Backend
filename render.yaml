# Render Blueprint for the KnowPilot backend. Values marked sync: false are entered in the Render dashboard.
services:
  - type: web
    name: knowpilot-backend
    runtime: python
    region: singapore  # same region as the Supabase pooler (ap-southeast-1)
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13"
      # Secrets / per-deployment values
      - key: DATABASE_URL  # Supabase Session pooler, postgresql+psycopg://...
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: JWT_SECRET  # random 256-bit value generated by Render
        generateValue: true
      - key: FRONTEND_ORIGIN  # comma-separated, e.g. https://knowpilot.vercel.app
        sync: false
      - key: PUBLIC_APP_URL  # the frontend URL used in assistant links, e.g. https://knowpilot.vercel.app
        sync: false
      # Non-secret settings
      - key: SUPABASE_BUCKET
        value: documents
      - key: GEMINI_CHAT_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_EMBED_MODEL
        value: gemini-embedding-001
      - key: EMBED_DIM
        value: "768"
      - key: JWT_EXPIRE_MINUTES
        value: "720"
      - key: GATE_MIN_SIMILARITY
        value: "0.60"
      - key: GATE_KEYWORD_MIN_SIMILARITY
        value: "0.55"
